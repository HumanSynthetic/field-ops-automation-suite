name: Temporary Lab 8 catalog query

on:
  push:
    branches:
      - tmp-lab8-pleiades-data-20260712
    paths:
      - .github/workflows/lab8-query.yml

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-lab8-pleiades-data-20260712
      - name: Query VizieR and save CSV
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request
          query = '''SELECT TOP 100 HIP, "_RA.icrs" AS RAdeg, "_DE.icrs" AS DEdeg, Vmag, "B-V" AS BV
          FROM "I/239/hip_main"
          WHERE 1=CONTAINS(POINT('ICRS', "_RA.icrs", "_DE.icrs"), POLYGON('ICRS', 57.5764, 24.2902, 57.2354, 24.7277, 56.5968, 24.3203, 56.9377, 23.8830))
          AND Vmag IS NOT NULL AND "B-V" IS NOT NULL
          ORDER BY Vmag'''
          url = 'https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync?' + urllib.parse.urlencode({
              'request': 'doQuery', 'lang': 'ADQL', 'format': 'csv', 'query': query
          })
          data = urllib.request.urlopen(url, timeout=120).read()
          open('scratch/section_b_hipparcos.csv', 'wb').write(data)
          print(data.decode('utf-8', errors='replace'))
          PY
      - name: Commit query result
        run: |
          git config user.name "Lab 8 temporary automation"
          git config user.email "actions@users.noreply.github.com"
          git add scratch/section_b_hipparcos.csv
          git commit -m "Store temporary Section B catalog result" || exit 0
          git push
