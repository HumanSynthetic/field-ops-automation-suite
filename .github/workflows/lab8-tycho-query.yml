name: Temporary Lab 8 photometry query

on:
  push:
    branches:
      - tmp-lab8-pleiades-data-20260712
    paths:
      - .github/workflows/lab8-tycho-query.yml

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-lab8-pleiades-data-20260712
      - name: Query APASS photometry and save Section B rows
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, traceback, csv, io
          params = {
            '-source':'II/336/apass9', '-c':'56.9 24.3', '-c.rm':'72',
            '-out':'recno,RAJ2000,DEJ2000,Vmag,Bmag', '-out.max':'unlimited'
          }
          url = 'https://vizier.cds.unistra.fr/viz-bin/asu-tsv?' + urllib.parse.urlencode(params)
          poly=[(57.5764,24.2902),(57.2354,24.7277),(56.5968,24.3203),(56.9377,23.8830)]
          def inside(x,y):
            c=False; j=len(poly)-1
            for i in range(len(poly)):
              xi,yi=poly[i]; xj,yj=poly[j]
              if ((yi>y)!=(yj>y)) and (x < (xj-xi)*(y-yi)/(yj-yi+1e-30)+xi): c=not c
              j=i
            return c
          try:
            raw=urllib.request.urlopen(url,timeout=120).read().decode('utf-8','replace')
            lines=[ln for ln in raw.splitlines() if ln and not ln.startswith('#')]
            # VizieR TSV includes units/separator rows after header; parse carefully
            reader=csv.DictReader(io.StringIO('\n'.join(lines)), delimiter='\t')
            out=[]
            for r in reader:
              try:
                ra=float(r['RAJ2000']); dec=float(r['DEJ2000']); v=float(r['Vmag']); b=float(r['Bmag'])
              except Exception:
                continue
              if inside(ra,dec): out.append((v,b-v,r.get('recno',''),ra,dec,b))
            out.sort()
            buf=io.StringIO(); w=csv.writer(buf); w.writerow(['recno','RAdeg','DEdeg','Vmag','Bmag','B-V'])
            for v,bv,rec,ra,dec,b in out: w.writerow([rec,ra,dec,v,b,round(bv,3)])
            data=buf.getvalue().encode()
          except Exception:
            data=(traceback.format_exc()+'\nURL='+url).encode()
          open('scratch/section_b_tycho.csv','wb').write(data)
          print(data.decode('utf-8','replace'))
          PY
      - name: Commit query result
        run: |
          git config user.name "Lab 8 temporary automation"
          git config user.email "actions@users.noreply.github.com"
          git add scratch/section_b_tycho.csv
          git commit -m "Store temporary Section B APASS result" || exit 0
          git push
