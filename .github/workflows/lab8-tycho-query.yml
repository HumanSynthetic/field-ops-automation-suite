name: Temporary Lab 8 Tycho query

on:
  push:
    branches:
      - tmp-lab8-pleiades-data-20260712
    paths:
      - .github/workflows/lab8-tycho-query.yml

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-lab8-pleiades-data-20260712
      - name: Query Tycho-2 raw output
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, traceback
          params={'-source':'I/259/tyc2','-c':'56.9 24.3','-c.rm':'72','-out':'TYC,RAdeg,DEdeg,VTmag,BTmag','-out.max':'unlimited'}
          url='https://vizier.cds.unistra.fr/viz-bin/asu-tsv?'+urllib.parse.urlencode(params)
          try: data=urllib.request.urlopen(url,timeout=120).read()
          except Exception: data=(traceback.format_exc()+'\nURL='+url).encode()
          open('scratch/section_b_tycho.csv','wb').write(data)
          print(data.decode('utf-8','replace'))
          PY
      - name: Commit query result
        run: |
          git config user.name "Lab 8 temporary automation"
          git config user.email "actions@users.noreply.github.com"
          git add scratch/section_b_tycho.csv
          git commit -m "Store temporary Tycho raw result" || exit 0
          git push
